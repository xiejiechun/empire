[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "empire-research"
version = "0.1.0"
description = "Plugin-based A-share research desktop"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "redis>=5.2,<7",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL[rsa]>=1.1,<2",
  "httpx[socks]>=0.28,<1",
  "pydantic>=2.10,<3",
  "pypdf==6.20.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.18,<2", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1",
       "pyinstaller==6.22.3"]

[project.scripts]
empire = "empire.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/empire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires explicitly configured test Redis and MySQL",
  "slow: deterministic local capacity or lifecycle test",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "src/empire/contracts/collector.py",
  "src/empire/plugins/collectors/support.py",
  "src/empire/contracts/task.py",
  "src/empire/contracts/bundle.py",
  "src/empire/features/news/contract.py",
  "src/empire/features/holders/contract.py",
  "src/empire/contracts/business_schema.py",
  "src/empire/features/kaipanla/api.py",
  "src/empire/features/stocks/api.py",
  "src/empire/features/calendar/api.py",
  "src/empire/features/calendar/contract.py",
  "src/empire/contracts/preparation.py",
  "src/empire/contracts/confirmation.py",
]
