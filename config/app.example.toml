# Copy to config/local.toml. Local credentials are ignored by version control.
# EMPIRE_MYSQL_PASSWORD and EMPIRE_REDIS_PASSWORD override passwords below.
[app]
environment = "dev"

[redis]
host = "127.0.0.1"
port = 6379
password = ""
db = 0
namespace = "empire:dev"

[mysql]
host = "127.0.0.1"
port = 3307
user = "empire"
password = ""
database = "empire"
connect_timeout = 5

[archive]
interval_seconds = 60
batch_size = 100

[ingest]
high_watermark = 0.70
low_watermark = 0.50
max_queue_entries = 100000
max_page_bytes = 524288

[sina_universe]
page_size = 80

# Sina news uses 50 items per page; first run reads one page, later runs stop at the prior watermark.

[rate_groups.sina]
domains = ["sina.com.cn"]
min_interval_ms = 2000
max_concurrency = 1

[rate_groups.cninfo]
domains = ["cninfo.com.cn"]
min_interval_ms = 2000
max_concurrency = 1
